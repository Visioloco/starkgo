name: Build APK
on:
  push:
    branches: [ principal ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: |
          cd stark_go
          flutter pub get

      - name: Build APK
        run: |
          cd stark_go
          flutter build apk --split-per-abi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: StarkGo-APK
          path: stark_go/build/app/outputs/flutter-apk/*.apk
