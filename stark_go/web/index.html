<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="StarkGo">

  <meta name="robots" content="noindex" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <!-- Open Graph & SEO -->
  <meta property="og:title" content="StarkGo" />
  <meta property="og:description" content="Built with FlutterFlow." />
  <meta property="og:image" content="https://storage.googleapis.com/flutterflow-prod-hosting/og_splash_gradient.png" />
  <meta name="twitter:title" content="StarkGo" />
  <meta name="twitter:description" content="Built with FlutterFlow." />
  <meta name="twitter:image" content="https://storage.googleapis.com/flutterflow-prod-hosting/og_splash_gradient.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <title>StarkGo</title>
  <meta name="description" content="Built with FlutterFlow." />

  <!-- Status Bar -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f1f4f8">
  <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#f1f4f8">

  <link rel="manifest" href="manifest.json">

  <!-- ✅ Estilos del splash web nativo -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body { overflow: hidden; }

    #web-splash {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #1A3A5C 0%, #1A73E8 55%, #00C6AE 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.6s ease;
    }

    #web-splash.hide {
      opacity: 0;
      pointer-events: none;
    }

    /* Partículas decorativas */
    #web-splash::before {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: rgba(255,255,255,0.04);
      top: -80px;
      left: -80px;
    }
    #web-splash::after {
      content: '';
      position: absolute;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: rgba(255,255,255,0.04);
      bottom: -60px;
      right: -40px;
    }

    #web-splash img {
      width: 170px;
      height: 170px;
      object-fit: contain;
      filter: drop-shadow(0 16px 40px rgba(0,198,174,0.35));
      animation: splashPop 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s both;
    }

    #web-splash h1 {
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 40px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-top: 28px;
      text-shadow: 0 4px 20px rgba(0,0,0,0.15);
      animation: splashSlideUp 0.7s ease 0.9s both;
    }

    #web-splash .subtitle {
      color: rgba(255,255,255,0.55);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 15px;
      font-weight: 400;
      letter-spacing: 0.5px;
      margin-top: 8px;
      animation: splashFade 0.6s ease 1.1s both;
    }

    #web-splash .divider {
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
      border-radius: 2px;
      margin-top: 14px;
      animation: expandLine 0.8s ease 1s forwards;
    }

    #web-splash .footer {
      position: absolute;
      bottom: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      animation: splashFade 0.5s ease 1.4s both;
    }

    #web-splash .spinner {
      width: 30px;
      height: 30px;
      border: 2.5px solid rgba(255,255,255,0.15);
      border-top-color: rgba(255,255,255,0.6);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    #web-splash .loading-txt {
      color: rgba(255,255,255,0.35);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    #web-splash .version {
      position: absolute;
      bottom: 24px;
      color: rgba(255,255,255,0.18);
      font-family: sans-serif;
      font-size: 10px;
      letter-spacing: 0.5px;
    }

    /* Animaciones */
    @keyframes splashPop {
      from { opacity: 0; transform: scale(0.5); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes splashSlideUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes splashFade {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes expandLine {
      from { width: 0; opacity: 0; }
      to   { width: 110px; opacity: 1; }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>

  <!-- ✅ Splash nativo HTML — visible ANTES de que Flutter cargue -->
  <div id="web-splash">
    <img src="assets/assets/icon.png" alt="StarkGo Logo" />
    <h1>StarkGo</h1>
    <div class="divider"></div>
    <div class="subtitle">Panel de gestión</div>

    <div class="footer">
      <div class="spinner"></div>
      <div class="loading-txt">Cargando</div>
    </div>

    <div class="version">v1.0.1</div>
  </div>

  <!-- ✅ Flutter bootstrap — cuando termina oculta el splash HTML -->
  <script>
    // Oculta el splash HTML con fade cuando Flutter ya renderizó el primer frame
    window.addEventListener('flutter-first-frame', function () {
      const splash = document.getElementById('web-splash');
      if (splash) {
        splash.classList.add('hide');
        setTimeout(() => {
          splash.remove();
          document.body.style.overflow = '';
        }, 650);
      }
    });

    {{flutter_bootstrap_js}}
  </script>

</body>
</html>
